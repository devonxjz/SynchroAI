name: 4. Production Build & Docker Packaging

on:
  workflow_call:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean
    outputs:
      image_uri:
        description: 'Packaged Docker image URI'
        value: ${{ jobs.docker-build.outputs.image_uri }}
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker-build:
    name: Build & Package Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.export-uri.outputs.image_uri }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Lowercase Docker Package Name
        id: prep
        run: |
          # Docker/OCI specification mandates that repository and package names must be strictly lowercase
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${LOWER_REPO}" >> $GITHUB_OUTPUT
          echo "Resolved Docker package target: ${{ env.REGISTRY }}/${LOWER_REPO}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker Image (Local scan target)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.prep.outputs.image }}:scan-cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker Image CVEs (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.prep.outputs.image }}:scan-cache
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Push Docker Image to Container Registry
        if: ${{ inputs.push_image != false && github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Image URI
        id: export-uri
        run: |
          IMAGE_URI="${{ steps.prep.outputs.image }}:sha-${GITHUB_SHA::7}"
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
